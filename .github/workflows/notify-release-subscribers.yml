name: Notify release subscribers

on:
  release:
    types: [published, edited, released]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-subscriber-mail
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Ask MuseFilm to check the authoritative release feed
        env:
          RELEASE_ENDPOINT: https://musefilm-feedback-api.syrquartz.workers.dev/api/releases/check
        shell: bash
        run: |
          set -euo pipefail
          audience=$(printf '%s' "$RELEASE_ENDPOINT" | jq -sRr @uri)
          token=$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${audience}" | jq -er '.value')
          echo "::add-mask::$token"
          curl --fail-with-body --silent --show-error --retry 2 --retry-delay 5 \
            --max-time 30 -X POST -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" --data '{}' "$RELEASE_ENDPOINT"
